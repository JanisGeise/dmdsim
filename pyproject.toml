[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmdsim"
version = "0.1.0"
description = "Interactive playground for visualizing and exploring DMD quantities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "bokeh",
    # flowTorch is intentionally not a pip dependency; it is installed editable
    # from the local repository (see README.md)
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
dmdsim-app = "dmdsim.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
