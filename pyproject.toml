[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmdsim"
version = "0.1.0"
description = "Interactive playground for visualizing and exploring DMD quantities"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "bokeh",
    # flowTorch is installed via requirements.txt from the upstream repository
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
dmdsim-app = "dmdsim.app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
